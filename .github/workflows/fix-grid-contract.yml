name: one-time Grid provider contract fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[grid-contract-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Grid provider contract
        shell: python
        run: |
          from pathlib import Path

          p = Path('agents/grid/app/service/main.py')
          s = p.read_text()
          if 'CAPABILITY_SCHEMA = {' not in s:
              anchor = 'config = validate_runtime_config()\n'
              schema = '''\n\n# Machine-readable task contract consumed by AgentMarket discovery.\nCAPABILITY_SCHEMA = {\n    "type": "object",\n    "inputs": [\n        {"name": "lower_price", "required": True, "type": "number", "description": "Lower grid price."},\n        {"name": "upper_price", "required": True, "type": "number", "description": "Upper grid price; must be greater than lower_price."},\n        {"name": "grid_levels", "required": True, "type": "integer", "description": "Number of grid levels, from 2 to 100."},\n        {"name": "notional", "required": True, "type": "number", "description": "Total Testnet settlement notional."},\n        {"name": "max_slippage_bps", "required": False, "type": "integer", "default": 50, "description": "Maximum swap slippage in basis points; capped at 150."},\n    ],\n}\n'''
              if anchor not in s: raise SystemExit('Grid config anchor not found')
              s = s.replace(anchor, anchor + schema, 1)

          if 'async def _proxy_execution(request: Request, endpoint: str, method: str | None = None) -> Response:' not in s:
              s = s.replace(
                  'async def _proxy_execution(request: Request, endpoint: str) -> Response:',
                  'async def _proxy_execution(request: Request, endpoint: str, method: str | None = None) -> Response:',
                  1,
              )
              s = s.replace(
                  'body = None if request.method in {"GET", "HEAD"} else await request.body()',
                  'upstream_method = method or request.method\n    body = None if upstream_method in {"GET", "HEAD"} else await request.body()',
                  1,
              )
              s = s.replace(
                  'upstream = await client.request(request.method, f"{_EXECUTION_INTERNAL_URL}{endpoint}", headers=headers, content=body)',
                  'upstream = await client.request(upstream_method, f"{_EXECUTION_INTERNAL_URL}{endpoint}", headers=headers, content=body)',
                  1,
              )

          if 'method="GET"' not in s[s.find('async def execution_authorization'):s.find('async def execution_authorization') + 1200]:
              old = 'return await _proxy_execution(request, f"/execution-capabilities?job_id={job_id}{separator}{query}" if query else f"/execution-capabilities?job_id={job_id}")'
              new = 'return await _proxy_execution(request, f"/execution-capabilities?job_id={job_id}{separator}{query}" if query else f"/execution-capabilities?job_id={job_id}", method="GET")'
              if old not in s: raise SystemExit('execution authorization proxy call not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('agents/start_agent_v2.sh')
          s = p.read_text()
          if 'capability_schema = getattr(module, "CAPABILITY_SCHEMA", None)' not in s:
              marker = '    result = {\n'
              insert = '    capability_schema = getattr(module, "CAPABILITY_SCHEMA", None)\n    if not isinstance(capability_schema, dict):\n        capability_schema = None\n\n'
              if marker not in s: raise SystemExit('manifest result anchor not found')
              s = s.replace(marker, insert + marker, 1)
          old = '      "capabilities": [{"id": cap_id, "name": cap_name, "description": cap_desc, "metadata": {"agent_kind": kind}}],\n'
          new = '      "capabilities": [{"id": cap_id, "name": cap_name, "description": cap_desc, "metadata": {"agent_kind": kind, **({"input_schema": capability_schema} if capability_schema else {})}}],\n'
          if old not in s: raise SystemExit('capabilities manifest line not found')
          s = s.replace(old, new, 1)
          old = '      "metadata": {"discovery": "agent-provider/v1", "generated_by": "shared-agent-runtime"},\n'
          new = '      "metadata": {"discovery": "agent-provider/v1", "generated_by": "shared-agent-runtime", **({"capability_schema": capability_schema} if capability_schema else {})},\n'
          if old not in s: raise SystemExit('manifest metadata line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          compile(Path('agents/grid/app/service/main.py').read_text(), 'agents/grid/app/service/main.py', 'exec')
          print('Grid provider contract fix prepared.')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-grid-contract.yml
          git add agents/grid/app/service/main.py agents/start_agent_v2.sh
          git commit -m "fix: publish grid input schema and translate authorization proxy [grid-contract-fixed]"
          git push origin main
