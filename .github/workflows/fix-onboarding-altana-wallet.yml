name: Initialize onboarding Altana wallet

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[onboarding-altana-fixed]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch onboarding wallet creation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/altanaWallet.ts')
          text = path.read_text()

          old = '''  const funding = await fundAltanaWalletFromAgentMarketWallet(resolved.walletAddress);\n  await persistAltanaWalletResolution(resolved, { replaceExisting: Boolean(existing) });\n'''
          new = '''  const funding = await fundAltanaWalletFromAgentMarketWallet(resolved.walletAddress);\n\n  // Onboarding must finish the newly created Altana wallet's first execute before\n  // persisting it as usable. Altana's SDK performs the initial KeyStore admin-key\n  // registration on the wallet's first execute; without that transaction the wallet\n  // can be funded and saved successfully but later passkey recovery finds no keys.\n  // This branch is intentionally scoped to the onboarding route so the existing\n  // Execution Wallet / mission-console creation flow remains unchanged.\n  if (window.location.pathname === '/onboarding') {\n    await client.execute({\n      wallet: resolved.wallet,\n      signer: resolved.signer,\n      chainId,\n      calls: [{ to: funding.senderAddress, data: '0x', value: 0n }],\n    });\n  }\n\n  await persistAltanaWalletResolution(resolved, { replaceExisting: Boolean(existing) });\n'''

          if old not in text:
              raise SystemExit('expected onboarding wallet creation block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          npx vite build

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/altanaWallet.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: initialize onboarding Altana wallet before persistence [onboarding-altana-fixed]"
          git push
          git rm .github/workflows/fix-onboarding-altana-wallet.yml
          git commit -m "chore: remove one-time onboarding Altana wallet repair"
          git push
