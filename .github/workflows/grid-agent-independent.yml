name: Grid Agent Independent CI

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/grid/**"
  push:
    branches: [main, marketplace-testnet]
    paths:
      - "agents/grid/**"

jobs:
  grid-agent:
    name: Grid Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Grid Agent dependencies
        run: python -m pip install "bnbagent[server]" pytest
      - name: Run Grid Agent tests
        env:
          PYTHONPATH: agents/grid
        run: pytest agents/grid/tests -q

  grid-execution:
    name: Grid Altana executor typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache-dependency-path: agents/grid/execution/package.json
      - name: Install Grid executor dependencies
        working-directory: agents/grid/execution
        run: npm install --no-audit --no-fund
      - name: Typecheck Grid executor
        working-directory: agents/grid/execution
        run: npm run typecheck

  grid-container:
    name: Grid container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Grid container
        run: docker build -f agents/grid/Dockerfile agents/grid
