name: Fix provider quote response handling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-quote-response:
    if: ${{ !contains(github.event.head_commit.message, '[quote-response-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch provider quote response handling
        shell: python
        run: |
          from pathlib import Path

          p = Path('server/_testnet/quotes.ts')
          s = p.read_text()

          old = '''async function requestProviderQuote(endpoint: StoredEndpoint, taskDescription: string, terms: Record<string, unknown>) {
  const operation = await discoverQuoteOperation(endpoint);
  const result = await invokeProviderOperation(operation, {
    task_description: taskDescription,
    goal: taskDescription,
    terms,
    chain_id: TESTNET_CHAIN_ID,
    network: "bsc-testnet",
    environment: TESTNET_ENVIRONMENT,
  });
  if (!result.body || typeof result.body !== "object") throw new Error(`Provider quote endpoint ${operation.endpoint} returned a non-JSON response`);
  return { quote: result.body as ProviderQuote, operation };
}'''

          new = '''function providerQuoteFromBody(body: unknown): ProviderQuote {
  const object = (value: unknown): Record<string, unknown> | null =>
    value && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : null;
  const root = object(body);
  const candidates: unknown[] = [
    root,
    root?.quote,
    root?.data,
    object(root?.data)?.quote,
    root?.result,
    object(root?.result)?.quote,
    root?.response,
    object(root?.response)?.quote,
    root?.output,
    object(root?.output)?.quote,
    root?.operation_result,
  ];
  for (const candidate of candidates) {
    const value = object(candidate);
    if (!value) continue;
    if (["price_raw", "priceRaw", "raw_price", "amount_raw", "amountRaw", "settlement_amount_raw", "price"].some((key) => key in value)) {
      return value as ProviderQuote;
    }
  }
  throw new Error("Provider quote response did not expose a quote object with a price");
}

async function requestProviderQuote(endpoint: StoredEndpoint, taskDescription: string, terms: Record<string, unknown>) {
  const operation = await discoverQuoteOperation(endpoint);
  const result = await invokeProviderOperation(operation, {
    task_description: taskDescription,
    goal: taskDescription,
    terms,
    chain_id: TESTNET_CHAIN_ID,
    network: "bsc-testnet",
    environment: TESTNET_ENVIRONMENT,
  });
  if (result.status < 200 || result.status >= 300) {
    const detail = result.body && typeof result.body === "object" ? JSON.stringify(result.body).slice(0, 320) : result.rawText.slice(0, 320);
    throw new Error(`Provider quote request failed with HTTP ${result.status} at ${operation.method} ${operation.endpoint}${detail ? `: ${detail}` : ""}`);
  }
  return { quote: providerQuoteFromBody(result.body), operation };
}'''

          if old not in s:
              raise SystemExit('requestProviderQuote shape not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          workflow = Path('.github/workflows/fix-provider-quote-response.yml')
          files = workflow.read_text() if workflow.exists() else ''
          if not files:
              raise SystemExit('workflow file unexpectedly missing')

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_testnet/quotes.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: handle provider quote response envelopes and HTTP errors [quote-response-fixed]"
          git rm .github/workflows/fix-provider-quote-response.yml
          git commit -m "chore: remove one-time quote response workflow"
          git push
