name: First-party DeFi Agents

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/rebalancing/**"
      - "agents/yield/**"
      - "agents/health/**"
  push:
    branches: [main, marketplace-testnet]
    paths:
      - "agents/rebalancing/**"
      - "agents/yield/**"
      - "agents/health/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [rebalancing, yield, health]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.agent }} agent dependencies
        working-directory: agents/${{ matrix.agent }}
        run: python -m pip install -r requirements.txt
      - name: Run ${{ matrix.agent }} tests
        working-directory: agents/${{ matrix.agent }}
        env:
          PYTHONPATH: .
        run: pytest tests -q
      - name: Compile ${{ matrix.agent }} runtime
        working-directory: agents/${{ matrix.agent }}
        run: python -m compileall -q app
      - name: Build ${{ matrix.agent }} container exactly like Railway
        run: docker build --pull -f agents/${{ matrix.agent }}/Dockerfile .
