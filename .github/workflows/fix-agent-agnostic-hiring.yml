name: Fix agent-agnostic hiring discovery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-agnostic-hiring-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch manifest-first capability discovery and generic task inputs
        shell: python
        run: |
          from pathlib import Path

          # Capability discovery: canonical agent-provider/v1 manifests are authoritative.
          p = Path('server/_testnet/agent-capabilities.ts')
          s = p.read_text()
          import_line = 'import { discoverAgentProviderManifest, type AgentProviderManifest } from "./agent-provider-manifest.js";\n'
          if import_line not in s:
              marker = 'import { normalizeAgentCapability } from "../../src/lib/agentCapability.js";\n'
              s = s.replace(marker, marker + import_line, 1)

          needle = '''export async function discoverAgentCapabilities(\n  agent: Record<string, unknown>,\n  registeredEndpoints: Array<Record<string, unknown>> = [],\n): Promise<AgentCapabilitySnapshot> {\n  const agentId = String(agent.agent_id || agent.id || "unknown");'''
          replacement = '''export async function discoverAgentCapabilities(\n  agent: Record<string, unknown>,\n  registeredEndpoints: Array<Record<string, unknown>> = [],\n): Promise<AgentCapabilitySnapshot> {\n  const agentId = String(agent.agent_id || agent.id || "unknown");\n\n  // A canonical provider manifest is the source of truth for how this agent is\n  // contacted. Do not probe unrelated A2A/MCP/legacy well-known routes when the\n  // provider has already published an agent-provider/v1 contract.\n  const manifestEndpoint = registeredEndpoints.find((endpoint) => typeof endpoint.endpoint_url === "string" && endpoint.endpoint_url.trim());\n  if (manifestEndpoint) {\n    try {\n      const manifest: AgentProviderManifest | null = await discoverAgentProviderManifest({\n        endpoint_url: String(manifestEndpoint.endpoint_url),\n        metadata: manifestEndpoint.metadata,\n      });\n      if (manifest) {\n        const fallbackEndpoint = Object.values(manifest.endpoints).find((operation) => operation.transport === "http" || operation.transport === "https")?.url || String(manifestEndpoint.endpoint_url);\n        const manifestCapabilities = manifest.capabilities.flatMap((value) => {\n          const capability = normalizeAgentCapability({\n            kind: "task_submission",\n            name: typeof value.name === "string" ? value.name : manifest.name,\n            description: typeof value.description === "string" ? value.description : manifest.description || null,\n            endpoint: fallbackEndpoint,\n            transport: "http",\n            input_schema: value.input_schema || value.inputSchema || null,\n            output_schema: value.output_schema || value.outputSchema || null,\n            networks: manifest.networks || [],\n            metadata: {\n              ...(value.metadata && typeof value.metadata === "object" ? value.metadata : {}),\n              protocol: manifest.protocols.join(","),\n              source_type: "agent_provider_manifest",\n              manifest_url: manifest.manifestUrl,\n              manifest_endpoints: manifest.endpoints,\n              hiring: manifest.hiring,\n              execution: manifest.execution,\n            },\n          }, manifest.manifestUrl);\n          return capability ? [capability] : [];\n        });\n        return {\n          agent_id: agentId,\n          discovered_at: new Date().toISOString(),\n          source_urls: [manifest.manifestUrl],\n          capabilities: manifestCapabilities,\n          raw: { manifest },\n        };\n      }\n    } catch {\n      // Fall back to legacy discovery only when no usable canonical manifest can be resolved.\n    }\n  }'''
          if needle not in s:
              raise SystemExit('capability discovery insertion point not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          # Hiring UI: task questions must come from the provider capability schema,
          # never from the agent category.
          p = Path('src/MarketplaceWorkspace.tsx')
          s = p.read_text()
          s = s.replace('const gridParams = (category: string) => category === "grid_trading" ? { category, lower_price: 600, upper_price: 700, grid_levels: 12, notional: 100, max_slippage_bps: 50 } : { category };\n', '', 1)
          s = s.replace('''  function structuredParameters() {\n    if (!best) return {};\n    if (best.agent.category === "grid_trading") return gridParams(best.agent.category);\n    const output: Record<string, unknown> = { ...(cap?.capability.defaults || {}) };''', '''  function structuredParameters() {\n    if (!best) return {};\n    const output: Record<string, unknown> = { ...(cap?.capability.defaults || {}) };''', 1)
          old_validation = '''  function validateParameters(parameters: Record<string, unknown>) {\n    if (!best) return;\n    for (const input of requiredInputs) {\n      const value = parameters[input.name];\n      if (value === undefined || value === null || value === "" || (Array.isArray(value) && value.length === 0)) throw new Error(`${input.label || human(input.name)} is required.`);\n      if ((input.type === "number" || input.type === "integer") && (!Number.isFinite(Number(value)) || (input.type === "integer" && !Number.isInteger(Number(value))))) throw new Error(`${input.label || human(input.name)} must be a valid ${input.type}.`);\n      if (input.type === "boolean" && typeof value !== "boolean") throw new Error(`${input.label || human(input.name)} must be true or false.`);\n    }\n    if (best.agent.category === "rebalancing") {\n      const lower = Number(parameters.tick_lower);\n      const upper = Number(parameters.tick_upper);\n      if (Number.isFinite(lower) && Number.isFinite(upper) && upper <= lower) throw new Error("Upper tick must be greater than lower tick.");\n    }\n    if (best.agent.category === "health_factor" && Number(parameters.health_factor) <= 0) throw new Error("Health factor must be positive.");\n  }'''
          new_validation = '''  function validateParameters(parameters: Record<string, unknown>) {\n    for (const input of requiredInputs) {\n      const value = parameters[input.name];\n      if (value === undefined || value === null || value === "" || (Array.isArray(value) && value.length === 0)) throw new Error(`${input.label || human(input.name)} is required.`);\n      if ((input.type === "number" || input.type === "integer") && (!Number.isFinite(Number(value)) || (input.type === "integer" && !Number.isInteger(Number(value))))) throw new Error(`${input.label || human(input.name)} must be a valid ${input.type}.`);\n      if (input.type === "boolean" && typeof value !== "boolean") throw new Error(`${input.label || human(input.name)} must be true or false.`);\n    }\n  }'''
          if old_validation not in s:
              raise SystemExit('parameter validation block not found')
          s = s.replace(old_validation, new_validation, 1)
          s = s.replace("These questions come from the selected agent's capability schema. Only required inputs are requested; Grid keeps its existing defaults.", "These questions come from the selected agent's published capability schema. Only the inputs that the provider declares as required are requested.", 1)
          old_grid = '''          {best.agent.category === "grid_trading" ? <Info title="Grid task" value="Existing defaults unchanged: 600–700 · 12 levels · 100 notional · 50 bps slippage." /> : requiredInputs.length === 0 ? <div className="border border-line rounded-[14px] bg-paper p-4 mb-5 text-[12px] text-inksoft">This agent declares no required task inputs. Continue to quote.</div> : <div className="border border-line rounded-[14px] bg-paper p-4 mb-5"><div className="grid sm:grid-cols-2 gap-4">{requiredInputs.map((input) => input.type === "opportunities" ? <div key={input.name} className="sm:col-span-2"><label className="font-mono text-[9px] uppercase block mb-1">{input.label || human(input.name)} · required</label><textarea rows={5} value={yieldText} onChange={(e) => setYieldText(e.target.value)} placeholder="Protocol | market | APR | target" className="w-full border border-line rounded-[10px] bg-paperhi p-3 text-[12px]"/><small className="block text-[10px] text-inksoft mt-1">{input.help || ""}</small></div> : input.type === "boolean" ? <label key={input.name} className="flex items-center gap-3 border border-line rounded-[10px] bg-paperhi p-3 text-[12px]"><input type="checkbox" checked={params[input.name] === true || params[input.name] === "true"} onChange={(e) => setParams((current) => ({ ...current, [input.name]: e.target.checked }))} /><span><span className="font-mono text-[9px] uppercase block">{input.label || human(input.name)} · required</span>{input.help && <small className="text-[10px] text-inksoft">{input.help}</small>}</span></label> : <div key={input.name}><label className="font-mono text-[9px] uppercase block mb-1">{input.label || human(input.name)} · required</label><input type={input.type === "number" || input.type === "integer" ? "number" : "text"} step={input.type === "integer" ? 1 : "any"} value={String(params[input.name] ?? "")} onChange={(e) => setParams((current) => ({ ...current, [input.name]: e.target.value }))} className="w-full border border-line rounded-[10px] bg-paperhi p-3 text-[12px]"/>{input.help && <small className="block text-[10px] text-inksoft mt-1">{input.help}</small>}</div>)}</div></div>}\n'''
          new_grid = '''          {requiredInputs.length === 0 ? <div className="border border-line rounded-[14px] bg-paper p-4 mb-5 text-[12px] text-inksoft">This agent declares no required task inputs. Continue to quote using its published defaults.</div> : <div className="border border-line rounded-[14px] bg-paper p-4 mb-5"><div className="grid sm:grid-cols-2 gap-4">{requiredInputs.map((input) => input.type === "opportunities" ? <div key={input.name} className="sm:col-span-2"><label className="font-mono text-[9px] uppercase block mb-1">{input.label || human(input.name)} · required</label><textarea rows={5} value={yieldText} onChange={(e) => setYieldText(e.target.value)} placeholder="Enter the value in the format published by this agent" className="w-full border border-line rounded-[10px] bg-paperhi p-3 text-[12px]"/><small className="block text-[10px] text-inksoft mt-1">{input.help || ""}</small></div> : input.type === "boolean" ? <label key={input.name} className="flex items-center gap-3 border border-line rounded-[10px] bg-paperhi p-3 text-[12px]"><input type="checkbox" checked={params[input.name] === true || params[input.name] === "true"} onChange={(e) => setParams((current) => ({ ...current, [input.name]: e.target.checked }))} /><span><span className="font-mono text-[9px] uppercase block">{input.label || human(input.name)} · required</span>{input.help && <small className="text-[10px] text-inksoft">{input.help}</small>}</span></label> : <div key={input.name}><label className="font-mono text-[9px] uppercase block mb-1">{input.label || human(input.name)} · required</label><input type={input.type === "number" || input.type === "integer" ? "number" : "text"} step={input.type === "integer" ? 1 : "any"} value={String(params[input.name] ?? "")} onChange={(e) => setParams((current) => ({ ...current, [input.name]: e.target.value }))} className="w-full border border-line rounded-[10px] bg-paperhi p-3 text-[12px]"/>{input.help && <small className="block text-[10px] text-inksoft mt-1">{input.help}</small>}</div>)}</div></div>}\n'''
          if old_grid not in s:
              raise SystemExit('Grid-specific task input branch not found')
          s = s.replace(old_grid, new_grid, 1)
          p.write_text(s)

          # Remove this one-shot patch workflow after it succeeds.
          workflow = Path('.github/workflows/fix-agent-agnostic-hiring.yml')
          workflow_text = workflow.read_text()
          workflow_text += '\n'
          workflow.write_text(workflow_text)

      - name: Validate patch
        run: |
          npx tsc -b
          npx vite build

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_testnet/agent-capabilities.ts src/MarketplaceWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: make hiring discovery and task inputs agent agnostic [agent-agnostic-hiring-fixed]"
          git push
          git rm .github/workflows/fix-agent-agnostic-hiring.yml
          git commit -m "chore: remove one-time agent-agnostic hiring workflow"
          git push
