name: Fix Rebalancing execution UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[rebalancing-ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove implicit execution-capital request
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/ExecutionCapitalCard.tsx')
          s = p.read_text()
          pattern = re.compile(r'\n        if \(!request && !requestAttempted && resolvedMarketplaceJobId && !/\\d\+\$/\.test\(resolvedMarketplaceJobId\) && response\.ok && body\?\.status === "not_requested"\) \{.*?\n        \}', re.S)
          s2, n = pattern.subn('', s, count=1)
          if n != 1:
            raise SystemExit('Expected implicit execution-capital request block was not found')
          p.write_text(s2)
      - name: Commit and remove fixer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ExecutionCapitalCard.tsx
          git commit -m "Fix Rebalancing execution UI [rebalancing-ui-fix]"
          git rm .github/workflows/fix-rebalancing-execution-ui.yml
          git commit -m "Remove temporary Rebalancing UI fixer [rebalancing-ui-fix]" || true
          git push origin main
