name: Fix Rebalancing execution UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[rebalancing-ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove implicit execution-capital request
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ExecutionCapitalCard.tsx')
          s = p.read_text()
          start = s.find('        if (!request && !requestAttempted && resolvedMarketplaceJobId')
          end = s.find('      } catch {', start)
          if start < 0 or end < 0:
            raise SystemExit('Expected implicit execution-capital request block was not found')
          s = s[:start] + s[end:]
          p.write_text(s)
      - name: Commit and remove fixer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ExecutionCapitalCard.tsx
          git commit -m "Fix Rebalancing execution UI [rebalancing-ui-fix]"
          git rm .github/workflows/fix-rebalancing-execution-ui.yml
          git commit -m "Remove temporary Rebalancing UI fixer [rebalancing-ui-fix]"
          git push origin main
