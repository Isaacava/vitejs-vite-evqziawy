name: Index ERC-8004 Agents

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      start_id:
        description: "Start BSC Testnet agent ID"
        required: false
        default: "1"
      end_id:
        description: "End BSC Testnet agent ID"
        required: false
        default: "2000"

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install @supabase/supabase-js viem

      - name: Run BSC Testnet indexer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          START_ID: ${{ github.event.inputs.start_id || '1' }}
          END_ID: ${{ github.event.inputs.end_id || '2000' }}
          CONCURRENCY: "5"
        run: node index-agents.mjs
