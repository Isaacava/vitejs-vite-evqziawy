name: Unify WalletConnect session

on:
  push:
    branches:
      - marketplace-testnet

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: unify WalletConnect mission session')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mission page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          text = text.replace('import { EthereumProvider } from "@walletconnect/ethereum-provider";\n', '')
          text = text.replace('const WALLETCONNECT_PROJECT_ID = "1dbe8fd5e4974ae7c80d074c4082b5a0";\n\n', '')
          old = '''  async function connectWallet() {
    setWallet((w) => ({ ...w, connecting: true, error: null }));
    try {
      console.log("Initializing WalletConnect Testnet provider…");
      const provider = await Promise.race([
        EthereumProvider.init({
          projectId: WALLETCONNECT_PROJECT_ID,
          chains: [97],
          showQrModal: true,
          metadata: {
            name: "AgentMarket Testnet",
            description: "ERC-8004/8183 agent marketplace on BSC Testnet",
            url: window.location.origin,
            icons: [],
          },
        }),
        new Promise<never>((_, reject) =>
          setTimeout(() => reject(new Error("WalletConnect init timed out after 15s")), 15000)
        ),
      ]);
      console.log("WalletConnect Testnet provider initialized, opening connect flow…");
      await provider.connect();
      console.log("WalletConnect connect() resolved");

      const accounts = provider.accounts as string[];
      if (!accounts || accounts.length === 0) {
        throw new Error("No account returned from wallet.");
      }

      setWallet({
        address: accounts[0] as Address,
        connecting: false,
        error: null,
        provider: provider as unknown as EIP1193Provider,
      });
    } catch (e) {
      console.error("WalletConnect Testnet connection failed:", e);
      setWallet({
        address: null,
        connecting: false,
        error: e instanceof Error ? e.message : "Wallet connection was rejected or failed.",
        provider: null,
      });
    }
  }'''
          new = '''  async function connectWallet() {
    setWallet((w) => ({ ...w, connecting: true, error: null }));
    try {
      const { provider, address } = await ensureWalletConnectedProvider();
      setWallet({
        address: address as Address,
        connecting: false,
        error: null,
        provider: provider as unknown as EIP1193Provider,
      });
    } catch (e) {
      console.error("WalletConnect Testnet connection failed:", e);
      setWallet({
        address: null,
        connecting: false,
        error: e instanceof Error ? e.message : "Wallet connection was rejected or failed.",
        provider: null,
      });
    }
  }'''
          if old not in text:
              raise SystemExit('App connectWallet block not found')
          text = text.replace(old, new, 1)
          marker = 'import {\n  COMMERCE_ABI,'
          replacement = 'import { ensureWalletConnectedProvider } from "./lib/walletAuth";\nimport {\n  COMMERCE_ABI,'
          if marker not in text:
              raise SystemExit('App import marker not found')
          text = text.replace(marker, replacement, 1)
          p.write_text(text)
          PY
      - name: Remove obsolete workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/unify-walletconnect-session.yml
          git rm .github/workflows/unify-walletconnect-session.yml
          git commit -m "fix: unify WalletConnect mission session"
          git push
