name: Patch mission console actions

on:
  push:
    branches:
      - marketplace-testnet

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'chore: patch console actions via workflow')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch WalletConnect action provider, settle readiness, and adapter preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          wallet = Path('src/lib/walletAuth.ts')
          text = wallet.read_text()

          old = '''  walletConnectProvider = provider;\n  return { provider, address: wallet };'''
          new = '''  walletConnectProvider = provider;\n  // The mission console still supports a shared EIP-1193 surface for actions.\n  // When WalletConnect is the active session, expose that same provider so\n  // lifecycle actions reuse the already-connected wallet instead of asking\n  // for a second connection.\n  if (!getInjectedProvider()) window.ethereum = provider;\n  return { provider, address: wallet };'''
          if old not in text:
              raise SystemExit('walletAuth target block not found')
          text = text.replace(old, new, 1)

          old_signout = '''  finally {\n    try { await walletConnectProvider?.disconnect?.(); } catch { /* stale session */ }\n    walletConnectProvider = null;\n    walletConnectInitPromise = null;\n  }'''
          new_signout = '''  finally {\n    const activeWalletConnectProvider = walletConnectProvider;\n    try { await activeWalletConnectProvider?.disconnect?.(); } catch { /* stale session */ }\n    if (activeWalletConnectProvider && window.ethereum === activeWalletConnectProvider) {\n      try { delete window.ethereum; } catch { window.ethereum = undefined; }\n    }\n    walletConnectProvider = null;\n    walletConnectInitPromise = null;\n  }'''
          if old_signout not in text:
              raise SystemExit('walletAuth signOut block not found')
          text = text.replace(old_signout, new_signout, 1)
          wallet.write_text(text)

          console = Path('src/WorkspaceMissionConsoleLive.tsx')
          text = console.read_text()
          old_ready = '  const settlementReady = submitted && policy?.verdict !== null && policy?.verdict !== 0n && (disputeExpired || policy?.verdict === 2n);'
          new_ready = '  // Let the user press Settle whenever the job is SUBMITTED. The contract remains the authority: pending-policy calls are simulated first and will not open a wallet prompt unless settle is actually eligible.\n  const settlementReady = submitted;'
          if old_ready not in text:
              raise SystemExit('console settlementReady target not found')
          text = text.replace(old_ready, new_ready, 1)
          console.write_text(text)

          adapter = Path('src/lib/erc8183Adapter.ts')
          text = adapter.read_text()
          old_settle = '''export async function settleJob(args: {\n  jobId: bigint;\n  providerWallet: EIP1193Provider;\n  account: Address;\n}) {\n  const wallet = getWalletClient(args.providerWallet, args.account);\n  const hash = await wallet.writeContract({\n    address: ERC8183_ADDRESSES.router,\n    abi: ROUTER_ABI,\n    functionName: "settle",\n    args: [args.jobId, "0x"],\n    chain: undefined,\n  });\n  return { hash, receipt: await publicClient.waitForTransactionReceipt({ hash }) };\n}'''
          new_settle = '''export async function settleJob(args: {\n  jobId: bigint;\n  providerWallet: EIP1193Provider;\n  account: Address;\n}) {\n  // Simulate first so a user can safely press Settle while the optimistic\n  // policy is still pending without triggering a wallet confirmation that\n  // will certainly revert. The live contract remains the authority.\n  const simulation = await publicClient.simulateContract({\n    address: ERC8183_ADDRESSES.router,\n    abi: ROUTER_ABI,\n    functionName: "settle",\n    args: [args.jobId, "0x"],\n    account: args.account,\n  });\n  const wallet = getWalletClient(args.providerWallet, args.account);\n  const hash = await wallet.writeContract({\n    ...simulation.request,\n    chain: undefined,\n  });\n  return { hash, receipt: await publicClient.waitForTransactionReceipt({ hash }) };\n}'''
          if old_settle not in text:
              raise SystemExit('adapter settle target not found')
          text = text.replace(old_settle, new_settle, 1)
          adapter.write_text(text)
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/walletAuth.ts src/WorkspaceMissionConsoleLive.tsx src/lib/erc8183Adapter.ts .github/workflows/patch-console-actions.yml
          git rm .github/workflows/patch-console-actions.yml
          git commit -m "chore: patch console actions via workflow"
          git push
