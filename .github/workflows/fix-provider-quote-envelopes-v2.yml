name: Fix provider quote envelope normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[quote-envelope-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch quote response normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('server/_testnet/quotes.ts')
          text = path.read_text()

          replacement = r'''function providerQuoteFromBody(body: unknown): ProviderQuote {
  const object = (value: unknown): Record<string, unknown> | null =>
    value && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : null;
  const root = object(body);
  if (!root) throw new Error("Provider quote endpoint returned a non-object JSON response");

  const queue: unknown[] = [root];
  const visited = new Set<object>();
  const priceKeys = ["price_raw", "priceRaw", "raw_price", "amount_raw", "amountRaw", "settlement_amount_raw", "price"];
  const nestedKeys = ["quote", "data", "result", "response", "output", "operation_result"];

  while (queue.length > 0) {
    const candidate = queue.shift();
    const value = object(candidate);
    if (!value || visited.has(value)) continue;
    visited.add(value);

    if (priceKeys.some((key) => key in value)) return value as ProviderQuote;
    for (const key of nestedKeys) {
      const nested = value[key];
      if (nested && typeof nested === "object") queue.push(nested);
    }
  }

  throw new Error("Provider quote response did not expose a quote object with a supported price field");
}

async function requestProviderQuote(endpoint: StoredEndpoint, taskDescription: string, terms: Record<string, unknown>) {
  const operation = await discoverQuoteOperation(endpoint);
  const result = await invokeProviderOperation(operation, {
    task_description: taskDescription,
    goal: taskDescription,
    terms,
    chain_id: TESTNET_CHAIN_ID,
    network: "bsc-testnet",
    environment: TESTNET_ENVIRONMENT,
  });

  if (result.status < 200 || result.status >= 300) {
    const detail = result.body && typeof result.body === "object"
      ? JSON.stringify(result.body).slice(0, 320)
      : result.rawText.slice(0, 320);
    throw new Error(`Provider quote request failed with HTTP ${result.status} at ${operation.method} ${operation.endpoint}${detail ? `: ${detail}` : ""}`);
  }

  return { quote: providerQuoteFromBody(result.body), operation };
}'''

          pattern = re.compile(r"async function requestProviderQuote\(endpoint: StoredEndpoint, taskDescription: string, terms: Record<string, unknown>\) \{.*?\n\}\n\nasync function requestQuote", re.S)
          if not pattern.search(text):
              raise SystemExit('requestProviderQuote block not found')
          text = pattern.sub(lambda m: replacement + "\n\nasync function requestQuote", text, count=1)
          path.write_text(text)
          PY

      - name: Verify source patch
        run: |
          grep -q "function providerQuoteFromBody" server/_testnet/quotes.ts
          grep -q "result.status < 200 || result.status >= 300" server/_testnet/quotes.ts
          grep -q "return { quote: providerQuoteFromBody(result.body), operation }" server/_testnet/quotes.ts

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_testnet/quotes.ts
          git diff --cached --quiet && { git rm .github/workflows/fix-provider-quote-envelopes-v2.yml; git commit -m "chore: remove quote envelope patch workflow [quote-envelope-fixed]"; git push; exit 0; }
          git commit -m "fix: normalize provider quote response envelopes [quote-envelope-fixed]"
          git rm .github/workflows/fix-provider-quote-envelopes-v2.yml
          git commit -m "chore: remove quote envelope patch workflow [quote-envelope-fixed]"
          git push
