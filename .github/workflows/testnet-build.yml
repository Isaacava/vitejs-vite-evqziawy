name: Testnet Marketplace Build

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  push:
    branches:
      - marketplace-testnet

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript/Vite build
        run: npm run build

  grid-agent:
    name: Grid Agent Testnet tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/grid/requirements.txt

      - name: Install Grid Agent dependencies
        run: pip install -r agents/grid/requirements.txt

      - name: Run Grid Agent tests
        run: pytest agents/grid/tests -q

  network-isolation:
    name: Testnet network isolation audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Testnet branch does not use Mainnet ERC-8183 addresses
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "0xea4daa3100a767e86fded867729ae7446476eba6"
            "0x51895229e12f9876011789b04f8698af06ccd6da"
            "0x9c01845705b3078aa2e8cff7520a6376fd766de5"
          )
          for address in "${forbidden[@]}"; do
            if grep -Rni --exclude-dir=.git --exclude='package-lock.json' "$address" .; then
              echo "Found forbidden Mainnet contract address: $address"
              exit 1
            fi
          done

      - name: Verify Testnet identifiers are present
        shell: bash
        run: |
          set -euo pipefail
          grep -Rni --exclude-dir=.git --exclude='package-lock.json' "bsc-testnet" src api agents >/dev/null
          grep -Rni --exclude-dir=.git --exclude='package-lock.json' "chain_id.*97\|chainId.*97\|0x61" src api agents >/dev/null
