name: AgentMarket Marketplace Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, marketplace-testnet]

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript/Vite build
        run: npm run build

  marketplace-audit:
    name: Marketplace Testnet safety and Vercel Hobby audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Testnet surfaces do not use Mainnet ERC-8183 addresses
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "0xea4daa3100a767e86fded867729ae7446476eba6"
            "0x51895229e12f9876011789b04f8698af06ccd6da"
            "0x9c01845705b3078aa2e8cff7520a6376fd766de5"
          )
          surfaces=(src server/_testnet)
          for address in "${forbidden[@]}"; do
            if grep -Rni --exclude-dir=.git --exclude='package-lock.json' "$address" "${surfaces[@]}"; then
              echo "Found forbidden Mainnet ERC-8183 address in marketplace Testnet surface: $address"
              exit 1
            fi
          done
      - name: Verify marketplace Testnet chain configuration
        shell: bash
        run: |
          set -euo pipefail
          surfaces=(src server/_testnet)
          forbidden_patterns=(
            "chainId[^0-9]*56"
            "chain_id[^0-9]*56"
            "https://bscscan.com"
            "VITE_BSC_NETWORK=mainnet"
          )
          for pattern in "${forbidden_patterns[@]}"; do
            if grep -RniE --exclude-dir=.git --exclude='package-lock.json' "$pattern" "${surfaces[@]}"; then
              echo "Found forbidden Mainnet configuration in marketplace Testnet surface: $pattern"
              exit 1
            fi
          done
      - name: Verify required ERC-8183 lifecycle surfaces
        shell: bash
        run: |
          set -euo pipefail
          required=(createJob registerJob setBudget fund submit settle dispute voteReject claimRefund)
          surfaces=(src server/_testnet)
          for method in "${required[@]}"; do
            grep -Rni --exclude-dir=.git --exclude='package-lock.json' "$method" "${surfaces[@]}" >/dev/null || {
              echo "Missing ERC-8183 marketplace surface: $method"
              exit 1
            }
          done
      - name: Verify Vercel Hobby Function budget
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t functions < <(find api -type f -name '*.ts' ! -name '_*.ts' | sort)
          count=${#functions[@]}
          echo "Detected deployable Vercel API entrypoints: $count"
          printf '%s\n' "${functions[@]}"
          if [ "$count" -gt 12 ]; then
            echo "Vercel Hobby limit exceeded: $count deployable Functions."
            exit 1
          fi