name: Deploy ERC-8183 Testnet Contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - name: Checkout AgentMarket
        uses: actions/checkout@v4
        with:
          ref: marketplace-testnet

      - name: Checkout APEX contracts
        uses: actions/checkout@v4
        with:
          repository: bnb-chain/apex-contracts
          path: apex-contracts
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install APEX dependencies
        working-directory: apex-contracts
        run: bun install --frozen-lockfile

      - name: Configure Testnet deployment
        working-directory: apex-contracts
        env:
          BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
        run: |
          test -n "$BSC_TESTNET_PRIVATE_KEY"
          cp .env.example .env
          printf '\nPRIVATE_KEY=%s\n' "$BSC_TESTNET_PRIVATE_KEY" >> .env

      - name: Deploy fresh Testnet Router + Policy
        working-directory: apex-contracts
        run: bun run deploy:testnet

      - name: Show deployment outputs
        working-directory: apex-contracts
        run: |
          echo "Deployment completed. Review the deploy script output above for the new Router and Policy addresses."
